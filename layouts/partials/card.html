<article class="card">
    {{ with .Params.image }}
    <img src="{{ . }}" alt="{{ $.Title }}" class="card-img">
    {{ end }}
    <div class="card-content">
        <h3 class="card-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
        <p class="card-summary">{{ .Summary | truncate 100 }}</p>
        <div class="card-tags">
            {{ range .Params.tags }}
            <span class="tag">#{{ . }}</span>
            {{ end }}
        </div>
    </div>
</article>
