<div class="timeline">
    {{ range . }}
    <div class="timeline-item">
        <div class="timeline-dot"></div>
        <span class="timeline-date">{{ .Params.start_date }} - {{ if .Params.current }}Presente{{ else }}{{ .Params.end_date }}{{ end }}</span>
        <h3 class="timeline-role">{{ .Params.role }}</h3>
        <p class="timeline-company">{{ .Params.company }}</p>
        <div class="text-muted">
            {{ .Content }}
        </div>
    </div>
    {{ end }}
</div>
